# VoiceTranscription Configuration

[whisper]
# Path to the GGML Whisper model file
# Download from: https://huggingface.co/ggerganov/whisper.cpp/tree/main
model_path = "/path/to/ggml-base.bin"

# Model size: tiny, base, small, medium, large
# Only used if model_path is not specified (for future auto-download feature)
model_size = "base"

[transcription]
# Default language (ISO 639-1 code, e.g., "en", "he")
# Leave empty for auto-detection
language = ""

# Expected number of speakers (for diarization)
# Set to 1 to disable diarization
speaker_count = 1

[huggingface]
# HuggingFace token (for diarization models)
# Get your token from: https://huggingface.co/settings/tokens
token = ""

[google]
# Path to your Google Cloud service account key file
GOOGLE_APPLICATION_CREDENTIALS = ""
# Your Google Cloud project ID
GOOGLE_CLOUD_PROJECT_ID = ""
# Speech model to use
GOOGLE_SPEECH_MODEL = "chirp_3"
# Default language for transcription
GOOGLE_SPEECH_LANGUAGE = "en-US"
# Audio sample rate (Hz)
GOOGLE_SPEECH_SAMPLE_RATE = 16000
# Google Cloud region/location for Speech API
GOOGLE_SPEECH_LOCATION = "us"
# Batch transcription timeout in seconds
GOOGLE_SPEECH_BATCH_TIMEOUT = 1800

[assemblyai]
# AssemblyAI Configuration
# Get your API key from https://www.assemblyai.com/
ASSEMBLYAI_API_KEY = ""
