[workspace]
resolver = "2"
members = [
    ".",
    "bindings/python",
    "bindings/android",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Dotan Cohen"]
license = "MIT"
repository = "https://github.com/dotancohen/VoiceTranscription"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "fs"] }
thiserror = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "native-tls"] }

# Whisper
whisper-rs = "0.12"

# Python bindings
pyo3 = { version = "0.22", features = ["extension-module"] }

# Android bindings
uniffi = "0.28"

# Internal
voice-transcription = { path = "." }

[package]
name = "voice-transcription"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core transcription library with pluggable backends"

[dependencies]
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { workspace = true }
serde_json = { workspace = true }
whisper-rs = { workspace = true, optional = true }
async-trait = { workspace = true }
sha2 = "0.10"
dirs = "5"

# Cloud backends require reqwest with native-tls for SSL compatibility
reqwest = { workspace = true, optional = true }

[features]
default = ["local_whisper"]
local_whisper = ["whisper-rs"]
speechtext_ai = ["reqwest"]
assemblyai = ["reqwest"]
google_cloud = ["reqwest"]
all_backends = ["local_whisper", "speechtext_ai", "assemblyai", "google_cloud"]

[dev-dependencies]
tempfile = "3"
