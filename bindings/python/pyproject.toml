[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "voice-transcription"
version = "0.1.0"
description = "Audio transcription library with pluggable backends"
authors = [{ name = "Dotan Cohen" }]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
keywords = ["transcription", "whisper", "speech-to-text", "audio"]

[project.urls]
Repository = "https://github.com/dotancohen/VoiceTranscription"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "voice_transcription"
